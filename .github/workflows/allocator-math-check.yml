
name: PHP Allocator Memory Mapping Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mapping-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PHP source
        uses: actions/checkout@v4

      - name: Record source commit
        run: git rev-parse HEAD

      - name: Install build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf bison re2c pkg-config libxml2-dev

      - name: Build PHP CLI
        run: |
          ./buildconf --force
          ./configure --disable-all --enable-cli --without-pear
          make -j2

      - name: Create memory mapping probe
        run: |
          cat > /tmp/allocator_probe.c <<'C'
          #include "php.h"
          #include <unistd.h>
          #include <sys/mman.h>
          #include <stdint.h>
          #include <errno.h>

          ZEND_BEGIN_ARG_INFO_EX(arginfo_probe, 0, 0, 0)
          ZEND_END_ARG_INFO()

          PHP_FUNCTION(allocator_size_max_probe)
          {
              void *ptr = emalloc(4 * 1024 * 1024);
              write(2, "ALLOCATED\n", 10);

              void *resized = erealloc(ptr, (size_t)-1);
              write(2, "EREALLOC_RETURNED\n", 18);

              long page_size = sysconf(_SC_PAGESIZE);
              if (page_size <= 0) {
                  write(2, "RESULT: PAGE_SIZE_ERROR\n", 24);
                  _exit(2);
              }

              uintptr_t address = (uintptr_t) resized;
              uintptr_t page = address & ~((uintptr_t)page_size - 1);
              unsigned char vec = 0;

              int result = mincore(
                  (void *)page,
                  (size_t)page_size,
                  &vec
              );

              if (result == 0) {
                  write(2, "RESULT: MAPPING_PRESENT\n", 24);
              } else if (errno == ENOMEM) {
                  write(2, "RESULT: MAPPING_ABSENT\n", 23);
              } else {
                  write(2, "RESULT: MINCORE_INCONCLUSIVE\n", 29);
              }

              _exit(0);
          }

          static const zend_function_entry probe_functions[] = {
              PHP_FE(allocator_size_max_probe, arginfo_probe)
              PHP_FE_END
          };

          zend_module_entry allocator_probe_module_entry = {
              STANDARD_MODULE_HEADER,
              "allocator_probe",
              probe_functions,
              NULL, NULL, NULL, NULL, NULL,
              "0.1.0",
              STANDARD_MODULE_PROPERTIES
          };

          #ifdef COMPILE_DL_ALLOCATOR_PROBE
          ZEND_GET_MODULE(allocator_probe)
          #endif
          C

          cc -shared -fPIC \
            -DCOMPILE_DL_ALLOCATOR_PROBE=1 \
            -I. -Imain -IZend -ITSRM -Iext \
            /tmp/allocator_probe.c \
            -o /tmp/allocator_probe.so

      - name: Run isolated mapping test
        run: |
          set +e
          ulimit -c 0

          sapi/cli/php -n \
            -d extension=/tmp/allocator_probe.so \
            -r 'allocator_size_max_probe();'

          status=$?
          set -e

          echo "PHP_EXIT_CODE=$status"
          echo "Mapping test finished."
