
name: PHP Allocator Truncate Check

on:
  workflow_dispatch:

jobs:
  truncate-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PHP source
        uses: actions/checkout@v4

      - name: Inspect truncate function
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("Zend/zend_alloc.c").read_text()

          start = source.find("zend_mm_chunk_truncate(")
          if start < 0:
              raise SystemExit("Function not found")

          opening = source.find("{", start)
          depth = 0

          for i in range(opening, len(source)):
              if source[i] == "{":
                  depth += 1
              elif source[i] == "}":
                  depth -= 1
                  if depth == 0:
                      code = source[opening:i + 1]
                      break
          else:
              raise SystemExit("Could not parse function")

          print("TRUNCATE FUNCTION:")
          print(code)

          print("\nLinux munmap present:", "zend_mm_munmap" in code)
          print("Old size minus new size:", "old_size - new_size" in code)
          PY
