
name: PHP Allocator Runtime Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PHP source
        uses: actions/checkout@v4

      - name: Install build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf bison re2c pkg-config libxml2-dev

      - name: Build minimal PHP CLI
        run: |
          ./buildconf --force
          ./configure --disable-all --enable-cli --without-pear
          make -j2

      - name: Create isolated allocator probe extension
        run: |
          cat > /tmp/allocator_probe.c <<'C'
          #include "php.h"

          PHP_FUNCTION(allocator_size_max_probe)
          {
              void *ptr = emalloc(4 * 1024 * 1024);
              void *resized = erealloc(ptr, (size_t)-1);

              volatile unsigned char value =
                  *((volatile unsigned char *) resized);

              RETURN_LONG(value);
          }

          static const zend_function_entry probe_functions[] = {
              PHP_FE(allocator_size_max_probe, NULL)
              PHP_FE_END
          };

          zend_module_entry allocator_probe_module_entry = {
              STANDARD_MODULE_HEADER,
              "allocator_probe",
              probe_functions,
              NULL, NULL, NULL, NULL, NULL,
              "0.1.0",
              STANDARD_MODULE_PROPERTIES
          };

          #ifdef COMPILE_DL_ALLOCATOR_PROBE
          ZEND_GET_MODULE(allocator_probe)
          #endif
          C

          cc -shared -fPIC \
            -DCOMPILE_DL_ALLOCATOR_PROBE=1 \
            -I. -Imain -IZend -ITSRM -Iext \
            /tmp/allocator_probe.c \
            -o /tmp/allocator_probe.so

      - name: Run isolated runtime test
        run: |
          set +e
          ulimit -c 0

          sapi/cli/php -n \
            -d extension=/tmp/allocator_probe.so \
            -r 'allocator_size_max_probe();'

          status=$?
          set -e

          echo "PHP_EXIT_CODE=$status"

          if [ "$status" -eq 139 ]; then
            echo "RESULT: PHP received SIGSEGV during the probe."
          elif [ "$status" -eq 0 ]; then
            echo "RESULT: Probe completed without a crash."
          else
            echo "RESULT: INCONCLUSIVE. Exit code: $status"
          fi
