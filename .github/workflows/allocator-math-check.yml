
name: PHP Allocator Source Check

on:
  workflow_dispatch:

jobs:
  source-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PHP source
        uses: actions/checkout@v4

      - name: Inspect allocator functions
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          source = Path("Zend/zend_alloc.c").read_text()

          def get_function(name):
              pattern = re.compile(
                  r'\bstatic\s+(?:zend_never_inline\s+)?void\s*\*\s*'
                  + re.escape(name)
                  + r'\s*\([^;{}]*?\)\s*\{',
                  re.S
              )

              match = pattern.search(source)
              if not match:
                  raise RuntimeError(f"Function not found: {name}")

              start = source.find("{", match.start(), match.end())
              depth = 0

              for i in range(start, len(source)):
                  if source[i] == "{":
                      depth += 1
                  elif source[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[start:i + 1], source.count("\n", 0, match.start()) + 1

              raise RuntimeError(f"Could not parse: {name}")

          realloc_code, realloc_line = get_function("zend_mm_realloc_huge")
          alloc_code, alloc_line = get_function("zend_mm_alloc_huge")

          realloc_guard = "new_size < size" in realloc_code
          alloc_guard = "new_size < size" in alloc_code

          print("Realloc function line:", realloc_line)
          print("Alloc function line:", alloc_line)
          print("Realloc overflow guard:", realloc_guard)
          print("Alloc overflow guard:", alloc_guard)

          if alloc_guard and not realloc_guard:
              print("RESULT: Missing-check candidate found.")
          elif alloc_guard and realloc_guard:
              print("RESULT: Both functions contain the check.")
          else:
              print("RESULT: Pattern needs manual inspection.")
          PY
